<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 - 해피매지션 정호선</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .card {
            background: white; border-radius: 20px;
            padding: 50px 40px; max-width: 500px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
        }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 24px; display: flex;
            align-items: center; justify-content: center;
            font-size: 40px; color: white; font-weight: bold;
        }
        .name { font-size: 28px; font-weight: 700; color: #2d3748; margin-bottom: 8px; }
        .title { font-size: 16px; color: #667eea; font-weight: 600; margin-bottom: 24px; }
        .divider {
            width: 60px; height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 24px; border-radius: 2px;
        }
        .bio { font-size: 16px; line-height: 1.8; color: #4a5568; margin-bottom: 32px; text-align: center; }
        .contact { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .contact a {
            display: inline-block; padding: 10px 16px; background: #f7fafc;
            color: #4a5568; text-decoration: none; border-radius: 10px;
            font-size: 14px; transition: all 0.3s; border: 1px solid #e2e8f0;
        }
        .contact a:hover { background: #667eea; color: white; border-color: #667eea; }
        .footer { margin-top: 32px; font-size: 13px; color: #a0aec0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🎩</div>
        <h1 class="name">정호선 (해피매지션)</h1>
        <p class="title">꿈과 열정의 전도사 | 행복경영 컨설턴트</p>
        <div class="divider"></div>
        <p class="bio">
            안녕하세요! 행복경영 컨설턴트 정호선입니다.<br>
            34년간의 글로벌 마케팅 및 리더십 경험을 바탕으로,<br>
            많은 분들이 즐겁고 행복한 인생 2막을 설계할 수 있도록<br>
            강의, 컨설팅, 그리고 신비로운 마술로 소통하고 있습니다.<br><br>
            생성형 AI를 활용한 업무 자동화와 지식 나눔을 실천하며,<br>
            '생각하는 대로 사는 삶'을 함께 만들어갑니다.
        </p>
        <div class="contact">
            <!-- 대표님의 연락처 및 소셜 미디어 링크가 모두 적용되었습니다 -->
            <a href="mailto:father_happy@naver.com">이메일</a>
            <a href="https://blog.naver.com/father_happy" target="_blank">네이버 블로그</a>
            <a href="https://litt.ly/happymagician" target="_blank">전자 명함</a>
        </div>
        <p class="footer">지피터스 4주차 실습 | #행복경영 #자기경영</p>
    </div>
</body>
</html>
